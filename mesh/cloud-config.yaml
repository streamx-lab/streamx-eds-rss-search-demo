---
domains: []
global:
  services:
    ingestion:
      rest-ingestion:
        replicas: 1
    processing:
      indexable-resources-sql-transformer:
        stateful: true
      rendering-engine:
        stateful: true
      resource-downloader:
        stateful: true
    edge:
      opensearch-sink:
        replicas: 1
        stateful: true
      web-server-sink:
        replicas: 1
        stateful: true
  properties: {}
clusters:
  eu-central-waw-edge:
    enabled: true
    overlays:
      properties: {}
  eu-west-par-processing:
    enabled: true
    overlays:
      properties: {}
